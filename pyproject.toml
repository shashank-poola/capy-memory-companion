[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capy-companion"
version = "0.1.0"
description = "Capy companion memory core and persistence layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "numpy>=2.0.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
